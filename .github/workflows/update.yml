name: 매일 갱신 및 배포
on:
  schedule:
    - cron: "0 21 * * *"   # 매일 06:00 KST
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["site/index.html", "site/data/companies.json", "site/data/certs.json", "site/data/notes.json", "scripts/**", ".github/workflows/update.yml"]
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: 데이터 수집
        run: python3 scripts/collect.py
      - name: 수집 결과 저장
        run: |
          git config user.name "fe-career-radar bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data
          git diff --cached --quiet || (git commit -m "데이터 자동 갱신 $(TZ=Asia/Seoul date +%F)" && git push)
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
